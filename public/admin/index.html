<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#202225">
  <title>Pizza Visi · Administrace</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./tablet.css?v=1e3ef0ca">
  <script type="module" src="./app.js?v=ce14a2f4"></script>
</head>
<body>
  <a class="skip-link" href="#content">Přejít na obsah</a>
  <div class="pos-app">
    <aside class="nav-rail">
      <a href="../" class="wordmark" aria-label="Pizza Visi — veřejný web">PIZZA <em>VISI</em><i></i></a>
      <div class="rail-branch"><label for="branch">Pobočka</label><select id="branch" aria-label="Pobočka"></select></div>
      <nav aria-label="Hlavní navigace">
        <button type="button" data-view="orders" aria-current="page"><span class="nav-icon">▤</span>Objednávky<span class="rail-count" id="rail-count">0</span></button>
        <button type="button" data-view="stock"><span class="nav-icon">▦</span>Sklad<span id="stock-alert" class="alert-dot" hidden></span></button>
        <button type="button" data-view="recipes"><span class="nav-icon">☷</span>Receptury</button>
        <button type="button" data-view="history"><span class="nav-icon">◷</span>Historie</button>
      </nav>
      <div class="rail-bottom"><span class="demo-tag">DEMO PROVOZ</span><p>Ukázkové objednávky.<br>Data v tomto prohlížeči.</p><div class="rail-clock"><time id="clock"></time><span id="save-state">Lokálně uloženo</span></div><a href="../">Zpět na web ↗</a><small>Pizza Visi / obsluha</small></div>
    </aside>
    <main class="main-stage" id="content">
      <section id="workspace" aria-live="polite"><p class="empty-state">Připravujeme provozovnu…</p></section>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p>Administrace vyžaduje zapnutý JavaScript.</p></noscript>
</body>
</html>
